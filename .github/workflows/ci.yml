name: CI & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run unit test suite
        run: npm test

      - name: Setup PHP for linting
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Lint PHP files & test origin parsing
        run: |
          find . -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l
          bash test/embed-origin.sh

  release:
    name: Package & Publish GitHub Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches Plugin.php version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(sed -n "/function getPluginVersion/,/}/s/.*return '\([^']*\)'.*/\1/p" Plugin.php | head -1)

          echo "tag=${TAG_VERSION} plugin=${PLUGIN_VERSION}"

          if [ "${TAG_VERSION}" != "${PLUGIN_VERSION}" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match Plugin.php::getPluginVersion() (${PLUGIN_VERSION})"
            exit 1
          fi

      - name: Build plugin package
        run: bash scripts/package-plugin.sh

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Dots are regex metacharacters, and the heading may or may not bracket
          # the version; the trailing guard stops 0.1.0 matching 0.1.01.
          V_RE=$(printf '%s' "${VERSION}" | sed 's/\./\\./g')
          awk -v v="${V_RE}" '
            $0 ~ "^## \\[?"v"\\]?([^0-9.]|$)" { found = 1; next }
            found && /^## / { exit }
            found && $0 != "---" { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG section found for ${VERSION}; falling back to generated notes."
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="dist/Drawio-${VERSION}.zip"

          if [ -s release-notes.md ]; then
            NOTES=(--notes-file release-notes.md)
          else
            NOTES=(--generate-notes)
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # Re-running the same tag must converge, not fail: replace the asset
            # and refresh the notes rather than leaving a stale artifact behind.
            echo "Release ${GITHUB_REF_NAME} exists; updating it."
            gh release upload "${GITHUB_REF_NAME}" "${ARCHIVE}" --clobber
            if [ -s release-notes.md ]; then
              gh release edit "${GITHUB_REF_NAME}" \
                --title "${GITHUB_REF_NAME}" \
                --notes-file release-notes.md
            fi
          else
            gh release create "${GITHUB_REF_NAME}" "${ARCHIVE}" \
              --title "${GITHUB_REF_NAME}" \
              "${NOTES[@]}"
          fi
